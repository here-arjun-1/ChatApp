<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatApp</title>
<style>
  :root {
    --bg: #0b141a;
    --panel: #202c33;
    --bubble-me: #005c4b;
    --bubble-other: #202c33;
    --text: #e9edef;
    --muted: #8696a0;
    --accent: #00a884;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Login screen */
  #login {
    background: var(--panel);
    padding: 32px;
    border-radius: 12px;
    width: 300px;
    text-align: center;
  }
  #login h2 { margin-top: 0; }
  #login input {
    width: 100%;
    padding: 10px;
    margin: 12px 0;
    border-radius: 8px;
    border: none;
    background: #2a3942;
    color: var(--text);
    font-size: 15px;
  }
  #login button {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  #login .status { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 16px; }

  /* Chat screen */
  #chat {
    display: none;
    width: 420px;
    height: 640px;
    background: var(--panel);
    border-radius: 12px;
    overflow: hidden;
    flex-direction: column;
  }
  #header {
    background: #2a3942;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #header .name { font-weight: 600; }
  #header .conn-status { font-size: 12px; color: var(--muted); }
  #header .conn-status.online { color: var(--accent); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--bg);
  }
  .bubble {
    max-width: 75%;
    padding: 8px 12px;
    border-radius: 10px;
    line-height: 1.4;
    font-size: 14px;
  }
  .bubble .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    text-align: right;
  }
  .bubble.me {
    align-self: flex-end;
    background: var(--bubble-me);
    border-bottom-right-radius: 2px;
  }
  .bubble.other {
    align-self: flex-start;
    background: var(--bubble-other);
    border-bottom-left-radius: 2px;
  }

  #inputRow {
    display: flex;
    padding: 12px;
    background: #2a3942;
    gap: 8px;
  }
  #inputRow input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: none;
    background: #3a4a53;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  #inputRow button {
    background: var(--accent);
    border: none;
    color: #fff;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
  }
</style>
</head>
<body>

  <div id="login">
    <h2>ChatApp</h2>
    <input id="usernameInput" type="text" placeholder="Apna naam likho" />
    <button onclick="startChat()">Chat shuru karo</button>
    <div class="status" id="loginStatus"></div>
  </div>

  <div id="chat">
    <div id="header">
      <div class="name" id="myName"></div>
      <div class="conn-status" id="connStatus">Connecting...</div>
    </div>
    <div id="messages"></div>
    <div id="inputRow">
      <input id="messageInput" type="text" placeholder="Message likho..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()">&#10148;</button>
    </div>
  </div>

<script>
  // Backend is served from the same origin as this page, so derive it automatically.
  const BACKEND_HTTP = window.location.origin;
  const BACKEND_WS = BACKEND_HTTP.replace(/^http/, "ws");

  let username = "";
  let socket = null;

  function startChat() {
    const input = document.getElementById("usernameInput");
    const name = input.value.trim();
    if (!name) {
      document.getElementById("loginStatus").textContent = "Naam daalna zaroori hai";
      return;
    }
    username = name;
    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";
    document.getElementById("myName").textContent = username;

    loadHistory();
    connectWebSocket();
  }

  async function loadHistory() {
    try {
      const res = await fetch(`${BACKEND_HTTP}/messages`);
      const data = await res.json();
      data.forEach(renderMessage);
      scrollToBottom();
    } catch (err) {
      console.error("History load failed:", err);
    }
  }

  function connectWebSocket() {
    socket = new WebSocket(`${BACKEND_WS}/ws?user=${encodeURIComponent(username)}`);

    socket.onopen = () => {
      document.getElementById("connStatus").textContent = "Online";
      document.getElementById("connStatus").classList.add("online");
    };

    socket.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      renderMessage(msg);
      scrollToBottom();
    };

    socket.onclose = () => {
      document.getElementById("connStatus").textContent = "Disconnected — reconnecting...";
      document.getElementById("connStatus").classList.remove("online");
      setTimeout(connectWebSocket, 2000);
    };

    socket.onerror = () => {
      socket.close();
    };
  }

  function sendMessage() {
    const input = document.getElementById("messageInput");
    const content = input.value.trim();
    if (!content || !socket || socket.readyState !== WebSocket.OPEN) return;

    socket.send(JSON.stringify({ content }));
    input.value = "";

    renderMessage({ from: username, content, created_at: new Date().toISOString() });
    scrollToBottom();
  }

  function renderMessage(msg) {
    const div = document.createElement("div");
    const isMe = msg.from === username;
    div.className = "bubble " + (isMe ? "me" : "other");

    const time = new Date(msg.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

    div.innerHTML = `
      <div>${escapeHtml(msg.content)}</div>
      <div class="meta">${isMe ? "You" : escapeHtml(msg.from)} · ${time}</div>
    `;
    document.getElementById("messages").appendChild(div);
  }

  function scrollToBottom() {
    const box = document.getElementById("messages");
    box.scrollTop = box.scrollHeight;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
